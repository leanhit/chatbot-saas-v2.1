name: Build & Deploy Chatbot SaaS App

on:
  push:
    branches:
      - main
      - master

jobs:
  build-and-deploy:
    name: Build Docker Image and Deploy to Server
    runs-on: ubuntu-latest
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST || vars.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER || vars.SERVER_USER || 'root' }}
      SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY || vars.SERVER_SSH_KEY || secrets.PRIVATE_SCERET_KEY_CONNECT_TO_UBUNTU_SERVER }}
      SERVER_PORT: ${{ secrets.SERVER_PORT || vars.SERVER_PORT || '4433' }}
      SERVER_PATH: ${{ vars.SERVER_PATH || secrets.SERVER_PATH || '/root/chatbot-saas-v2.1/app-deploy' }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata / Lowercase Repository Name
        id: meta
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=ghcr.io/${REPO_LOWER}-app" >> $GITHUB_ENV

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./app-deploy/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Remote Server via SSH
        uses: appleboy/ssh-action@v1.2.0
        if: ${{ env.SERVER_HOST != '' }}
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          key: ${{ env.SERVER_SSH_KEY }}
          port: ${{ env.SERVER_PORT }}
          script: |
            APP_PATH="${{ env.SERVER_PATH }}"
            echo "Navigating to app deployment path: $APP_PATH"
            cd "$APP_PATH"
            
            echo "Logging into GHCR on server..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin || true
            
            echo "Pulling latest image..."
            docker compose pull || true
            
            echo "Restarting application container..."
            docker compose up -d
            
            echo "Cleaning up dangling images..."
            docker image prune -f
            echo "Deployment completed successfully!"
