# Redis Performance Optimization Configuration for Chatbot SaaS v2.1

# ========================================
# Memory Configuration
# ========================================

# Set maximum memory (adjust based on available RAM)
maxmemory 512mb

# Memory eviction policy - allkeys-lru for caching
maxmemory-policy allkeys-lru

# Memory usage when keys expire
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes

# ========================================
# Persistence Configuration
# ========================================

# Enable AOF persistence
appendonly yes
appendfilename "appendonly.aof"

# AOF fsync policy - every second for good performance
appendfsync everysec

# Enable AOF rewrite
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# RDB persistence (backup)
save 900 1
save 300 10
save 60 10000

# RDB compression
rdbcompression yes
rdbchecksum yes

# ========================================
# Network Configuration
# ========================================

# Bind to localhost and internal network
bind 127.0.0.1 10.0.0.1

# Port configuration
port 6380
tcp-backlog 511

# Timeout configuration
timeout 300
tcp-keepalive 300

# ========================================
# Client Configuration
# ========================================

# Maximum clients
maxclients 10000

# Output buffer limits for clients
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# ========================================
# Performance Configuration
# ========================================

# TCP keepalive
tcp-keepalive 300

# Hash table settings
hash-max-ziplist-entries 512
hash-max-ziplist-value 64

# List settings
list-max-ziplist-size -2
list-compress-depth 0

# Set settings
set-max-intset-entries 512

# Sorted set settings
zset-max-ziplist-entries 128
zset-max-ziplist-value 64

# HyperLogLog settings
hll-sparse-max-bytes 3000

# ========================================
# Logging Configuration
# ========================================

# Log level
loglevel notice

# Syslog enabled
syslog-enabled yes

# Log file
logfile "/var/log/redis/redis-server.log"

# ========================================
# Security Configuration
# ========================================

# Require password
requirepass your_redis_password_here

# Disable dangerous commands
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command KEYS ""
rename-command CONFIG ""
rename-command SHUTDOWN SHUTDOWN_892347
rename-command DEBUG ""

# ========================================
# Slow Log Configuration
# ========================================

# Slow log configuration
slowlog-log-slower-than 10000
slowlog-max-len 128

# ========================================
# Latency Monitoring
# ========================================

# Latency monitoring
latency-monitor-threshold 100

# ========================================
# Memory Optimization
# ========================================

# Enable memory defragmentation
activedefrag yes

# Active defragmentation thresholds
active-defrag-ignore-bytes 100mb
active-defrag-threshold-lower 10
active-defrag-threshold-upper 100
active-defrag-cycle-min 1
active-defrag-cycle-max 25

# ========================================
# Replication Configuration (if needed)
# ========================================

# Replication settings (for master)
# replica-announce-ip 10.0.0.1
# replica-announce-port 6380

# Replication settings (for replica)
# replicaof 10.0.0.1 6380
# masterauth your_redis_password_here

# ========================================
# Cluster Configuration (if needed)
# ========================================

# Cluster settings
# cluster-enabled yes
# cluster-config-file nodes-6380.conf
# cluster-node-timeout 5000
# cluster-announce-ip 10.0.0.1
# cluster-announce-port 6380
# cluster-announce-bus-port 16380

# ========================================
# Modules Configuration
# ========================================

# Load modules (if available)
# loadmodule /path/to/redisearch.so
# loadmodule /path/to/redistimeseries.so
# loadmodule /path/to/redisjson.so

# ========================================
# Monitoring Configuration
# ========================================

# Enable command stats
stat-cmd-enabled yes

# Enable extended stats
extended-stats yes

# ========================================
# Performance Tuning
# ========================================

# Disable transparent huge pages
disable-hugepages yes

# Enable jemalloc
jemalloc-bg-thread yes

# Set number of databases
databases 16

# ========================================
# Custom Configuration for Chatbot SaaS
# ========================================

# Cache TTL defaults (in seconds)
# User sessions: 1 hour
# API responses: 5 minutes  
# Database queries: 10 minutes
# Static content: 1 day

# Notification keyspace events for cache invalidation
notify-keyspace-events "Ex"

# ========================================
# Application-specific optimizations
# ========================================

# Optimize for chatbot workloads
# - Frequent reads of user sessions
# - Periodic writes of message counts
# - Cache of package configurations
# - Rate limiting data

# Pipeline configuration
pipeline-timeout 10000

# Multi-exec configuration
multi-exec-atomic yes

# ========================================
# Development/Debug Configuration
# ========================================

# Enable in production
protected-mode yes

# Disable debug commands in production
# rename-command EVAL ""
# rename-command SCRIPT ""

# ========================================
# Backup Configuration
# ========================================

# RDB backup settings
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes

# AOF backup settings
appendonly yes
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# ========================================
# Monitoring and Alerts
# ========================================

# Memory usage alerts
# Monitor when memory usage > 80%
# Alert when slow log > 100 entries

# Performance metrics
# Track hit ratio
# Monitor eviction rate
# Watch connection count
