# Test Configuration for Integration Tests
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:15432/chatbot_test_db}
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME:chatbot_user}
    password: ${SPRING_DATASOURCE_PASSWORD:chatbot_Admin_2025}

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: false

  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:16379}

logging:
  level:
    com.chatbot.core.routing: DEBUG
    org.hibernate.SQL: DEBUG
