# Production Configuration for Chatbot SaaS v2.1
spring:

# PgBouncer Configuration - Enabled for production
# All database connections go through PgBouncer connection pooler
pgbouncer:
  enabled: ${PGBOUNCER_ENABLED:true}
  host: ${PGBOUNCER_HOST:pgbouncer}
  port: ${PGBOUNCER_PORT:6432}

# Hub & Spoke Database Configuration via PgBouncer
app:
  datasource:
    identity:
      jdbc-url: ${IDENTITY_DB_URL:jdbc:postgresql://pgbouncer:6432/chatbot_identity_db}
      username: ${IDENTITY_DB_USER:chatbot_user}
      password: ${IDENTITY_DB_PASSWORD}
      driver-class-name: org.postgresql.Driver
      hikari:
        maximum-pool-size: 5
        minimum-idle: 1
        idle-timeout: 300000
        max-lifetime: 1200000
        connection-timeout: 20000
        pool-name: IdentityHikariCP

    user:
      jdbc-url: ${USER_DB_URL:jdbc:postgresql://pgbouncer:6432/chatbot_user_db}
      username: ${USER_DB_USER:chatbot_user}
      password: ${USER_DB_PASSWORD}
      driver-class-name: org.postgresql.Driver
      hikari:
        maximum-pool-size: 20
        minimum-idle: 5
        idle-timeout: 300000
        max-lifetime: 1200000
        connection-timeout: 20000
        pool-name: UserHikariCP

    tenant:
      jdbc-url: ${TENANT_DB_URL:jdbc:postgresql://pgbouncer:6432/chatbot_tenant_db}
      username: ${TENANT_DB_USER:chatbot_user}
      password: ${TENANT_DB_PASSWORD}
      driver-class-name: org.postgresql.Driver
      hikari:
        maximum-pool-size: 10
        minimum-idle: 2
        idle-timeout: 300000
        max-lifetime: 1200000
        connection-timeout: 20000
        pool-name: TenantHikariCP

    app:
      jdbc-url: ${APP_DB_URL:jdbc:postgresql://pgbouncer:6432/chatbot_app_db}
      username: ${APP_DB_USER:chatbot_user}
      password: ${APP_DB_PASSWORD}
      driver-class-name: org.postgresql.Driver
      hikari:
        maximum-pool-size: 5
        minimum-idle: 1
        idle-timeout: 300000
        max-lifetime: 1200000
        connection-timeout: 20000
        pool-name: AppHikariCP

    config:
      jdbc-url: ${CONFIG_DB_URL:jdbc:postgresql://pgbouncer:6432/chatbot_config_db}
      username: ${CONFIG_DB_USER:chatbot_user}
      password: ${CONFIG_DB_PASSWORD}
      driver-class-name: org.postgresql.Driver
      hikari:
        maximum-pool-size: 3
        minimum-idle: 1
        idle-timeout: 300000
        max-lifetime: 1200000
        connection-timeout: 20000
        pool-name: ConfigHikariCP

    message:
      jdbc-url: ${MESSAGE_DB_URL:jdbc:postgresql://pgbouncer:6432/chatbot_message_db}
      username: ${MESSAGE_DB_USER:chatbot_user}
      password: ${MESSAGE_DB_PASSWORD}
      driver-class-name: org.postgresql.Driver
      hikari:
        maximum-pool-size: 15
        minimum-idle: 5
        idle-timeout: 300000
        max-lifetime: 1200000
        connection-timeout: 20000
        pool-name: MessageHikariCP
      
# Spring Configuration
spring:
  threads:
    virtual:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        use_sql_comments: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:}

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
      file-size-threshold: 2MB

# Hub Database DDL Strategy — 'validate' in production for ALL hub databases
app:
  hibernate:
    ddl-auto: validate

  cors:
    allowed-origins: ${ALLOWED_ORIGINS:https://yourdomain.com,https://www.yourdomain.com}
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS
    allowed-headers: "*"
    allow-credentials: true
    
# Server Configuration
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  compression:
    enabled: true
  http2:
    enabled: true
    
# Logging Configuration
logging:
  level:
    root: WARN
    com.chatbot: INFO
    org.springframework.security: WARN
    org.springframework.web: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: /app/logs/application.log
    max-size: 100MB
    max-history: 30
    
# Management Endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      show-components: always
  metrics:
    export:
      prometheus:
        enabled: true
        
jwt:
  rotation:
    enabled: ${JWT_ROTATION_ENABLED:true}
    interval-days: ${JWT_ROTATION_INTERVAL_DAYS:90}

# Application Configuration
app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: 86400000 # 24 hours
    
  minio:
    endpoint: ${MINIO_ENDPOINT:http://minio:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:chatbot-files}
    
  integrations:
    minio:
      enabled: true
      endpoint: ${MINIO_ENDPOINT:http://minio:9000}
      access-key: ${MINIO_ACCESS_KEY:minioadmin}
      secret-key: ${MINIO_SECRET_KEY:minioadmin}
      bucket: ${MINIO_BUCKET:chatbot-files}

minio:
  endpoint: ${MINIO_ENDPOINT:http://minio:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  accessKey: ${MINIO_ACCESS_KEY:minioadmin}
  secretKey: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:chatbot-files}
  bucket-name: ${MINIO_BUCKET:chatbot-files}

app:
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:admin}
    password: ${RABBITMQ_PASSWORD}
    
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:https://yourdomain.com,https://www.yourdomain.com}
    
# Cache Configuration
cache:
  redis:
    time-to-live: 1800000 # 30 minutes
    cache-null-values: false
    
# Rate Limiting
rate-limit:
  enabled: true
  requests-per-minute: 100
  burst-capacity: 200
