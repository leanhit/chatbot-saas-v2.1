app.datasource.billing.username=sa
app.datasource.billing.password=
app.datasource.billing.driver-class-name=org.h2.Driver

app.datasource.wallet.jdbc-url=jdbc:h2:mem:wallet_testdb;DB_CLOSE_DELAY=-1
app.datasource.wallet.username=sa
