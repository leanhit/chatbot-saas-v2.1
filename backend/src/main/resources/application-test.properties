# Test Profile Configuration

# Test Database Configuration (H2 in-memory for faster testing)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# H2 Console for debugging (only in test)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA Configuration for Testing
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true

# Hub Databases (H2 in-memory for testing)
app.datasource.identity.jdbc-url=jdbc:h2:mem:identity_testdb;DB_CLOSE_DELAY=-1
app.datasource.identity.username=sa
app.datasource.identity.password=
app.datasource.identity.driver-class-name=org.h2.Driver

app.datasource.user.jdbc-url=jdbc:h2:mem:user_testdb;DB_CLOSE_DELAY=-1
app.datasource.user.username=sa
app.datasource.user.password=
app.datasource.user.driver-class-name=org.h2.Driver

app.datasource.tenant.jdbc-url=jdbc:h2:mem:tenant_testdb;DB_CLOSE_DELAY=-1
app.datasource.tenant.username=sa
app.datasource.tenant.password=
app.datasource.tenant.driver-class-name=org.h2.Driver

app.datasource.app.jdbc-url=jdbc:h2:mem:app_testdb;DB_CLOSE_DELAY=-1
app.datasource.app.username=sa
app.datasource.app.password=
app.datasource.app.driver-class-name=org.h2.Driver

