# Simple Payment Test Configuration
payment.datasource.jdbc-url=jdbc:h2:mem:user_testdb;DB_CLOSE_DELAY=-1
payment.datasource.username=sa
payment.datasource.password=
payment.datasource.driver-class-name=org.h2.Driver

# Test-specific configurations
spring.security.jwt.secret=test-jwt-secret-key-for-testing-only
spring.security.jwt.expiration=3600000

# Redis Test Configuration (using embedded Redis if available)
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms

# RabbitMQ Test Configuration
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Logging Configuration for Testing
logging.level.com.chatbot=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.testcontainers=INFO

# Test-specific application properties
app.name=Chatbot SaaS v2.1 (Test)
app.version=0.1.0-test
app.description=Multi-tenant Chatbot Platform with Hub & Spoke Architecture (Test Environment)

# Disable some integrations for testing
app.integrations.botpress.enabled=false
app.integrations.odoo.enabled=false
app.integrations.minio.enabled=false

# Management endpoints for testing
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
