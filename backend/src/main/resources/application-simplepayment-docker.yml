# Docker Configuration for SimplePayment Module
simplepayment:
  # Bank Account Configuration
  bank:
    name: "${PAYMENT_BANK_NAME:Vietcombank}"
    account-number: "${PAYMENT_BANK_ACCOUNT_NUMBER:1234567890}"
    account-name: "${PAYMENT_BANK_ACCOUNT_NAME:CHATBOT SaaS}"
    
  # Bank API Configuration
  bank-api:
    provider: "${BANK_API_PROVIDER:mock}"
    api-url: "${BANK_API_URL:http://localhost:3000/mock-bank}"
    api-key: "${BANK_API_KEY:dev-mock-key-12345}"
    timeout: 30000
    retry-attempts: 3
    retry-delay: 1000
    
  # QR Code Configuration
  qr-code:
    provider: vietqr
    template: compact
    size: 300
    logo-enabled: true
    
  # Payment Configuration
  payment:
    qr-expiry-hours: 24
    min-amount: 10000
    max-amount: 50000000
    allowed-currencies: VND
    
  # Webhook Configuration
  webhook:
    enabled: true
    signature-secret: "${WEBHOOK_SIGNATURE_SECRET:dev-webhook-secret-change-in-production}"
    timeout: 10000
    retry-attempts: 3
    retry-delay: 5000
    
  # Rate Limiting Configuration
  rate-limit:
    enabled: true
    public-endpoints:
      requests-per-minute: 60
      burst-capacity: 100
    authenticated-endpoints:
      requests-per-minute: 120
      burst-capacity: 200
      
  # Email Notification Configuration
  email:
    enabled: true
    from: "${EMAIL_FROM:noreply@chatbot.com}"
    template-path: classpath:/templates/payment/
    
  # Invoice Configuration
  invoice:
    enabled: true
    storage-path: /app/uploads/invoices/
    template: default
    
  # Discount Configuration
  discount:
    enabled: true
    max-discount-percentage: 50
    min-amount-for-discount: 100000
    
  # Monitoring Configuration
  monitoring:
    metrics-enabled: true
    audit-logging-enabled: true
    slow-query-threshold-ms: 1000
    
  # Security Configuration
  security:
    mask-sensitive-data: true
    log-payment-details: true
    require-https: false
