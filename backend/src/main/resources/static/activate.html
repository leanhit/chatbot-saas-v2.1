<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>License Activation - ChatBot SaaS</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: white;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        .logo {
            font-size: 2.5em;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
        }
        .title {
            color: #333;
            margin-bottom: 30px;
            font-size: 1.5em;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
            box-sizing: border-box;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
            width: 100%;
        }
        .btn:hover {
            transform: translateY(-2px);
        }
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .loading {
            display: none;
            margin-top: 20px;
            color: #667eea;
        }
        .error {
            background: #fee;
            color: #c33;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
        }
        .success {
            background: #efe;
            color: #3c3;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
        }
        .info {
            background: #e3f2fd;
            color: #1976d2;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🤖 ChatBot</div>
        <h1 class="title">License Activation</h1>
        
        <div class="info">
            <strong>📋 Hướng dẫn:</strong><br>
            1. Copy activation token từ email hoặc dashboard<br>
            2. Paste vào ô bên dưới<br>
            3. Click "Activate License"
        </div>

        <div class="error" id="error"></div>
        <div class="success" id="success"></div>
        
        <form id="activationForm">
            <div class="form-group">
                <label for="token">Activation Token:</label>
                <input type="text" id="token" name="token" placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..." required>
            </div>
            
            <button type="submit" class="btn" id="activateBtn">
                🚀 Activate License
            </button>
            
            <div class="loading" id="loading">
                ⏳ Đang kích hoạt license...
            </div>
        </form>
    </div>

    <script>
        const form = document.getElementById('activationForm');
        const tokenInput = document.getElementById('token');
        const activateBtn = document.getElementById('activateBtn');
        const loading = document.getElementById('loading');
        const error = document.getElementById('error');
        const success = document.getElementById('success');

        // Get token from URL parameter
        const urlParams = new URLSearchParams(window.location.search);
        const tokenFromUrl = urlParams.get('token');
        if (tokenFromUrl) {
            tokenInput.value = tokenFromUrl;
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const token = tokenInput.value.trim();
            if (!token) {
                showError('Vui lòng nhập activation token');
                return;
            }

            setLoading(true);
            hideMessages();

            try {
                const response = await fetch(`/api/license/activate/${token}`, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });

                const result = await response.json();

                if (response.ok) {
                    showSuccess('License đã được kích hoạt thành công!');
                    activateBtn.textContent = '✅ Activation Complete';
                    activateBtn.disabled = true;
                    
                    // Redirect after 2 seconds
                    setTimeout(() => {
                        window.location.href = '/dashboard';
                    }, 2000);
                } else {
                    showError(result.message || 'Activation failed');
                }
            } catch (err) {
                showError('Lỗi kết nối: ' + err.message);
            } finally {
                setLoading(false);
            }
        });

        function setLoading(isLoading) {
            if (isLoading) {
                activateBtn.disabled = true;
                loading.style.display = 'block';
            } else {
                activateBtn.disabled = false;
                loading.style.display = 'none';
            }
        }

        function showError(message) {
            error.textContent = '❌ ' + message;
            error.style.display = 'block';
        }

        function showSuccess(message) {
            success.textContent = '✅ ' + message;
            success.style.display = 'block';
        }

        function hideMessages() {
            error.style.display = 'none';
            success.style.display = 'none';
        }
    </script>
</body>
</html>
