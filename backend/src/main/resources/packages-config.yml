    price: 499000
    currency: "VND"
    duration: "6 month"
    description: "Business package for 6 months"
    messageLimit: 2147483647
    chatbotLimit: 20
    hasPrioritySupport: true
    hasAnalytics: true
    hasAdvancedAnalytics: true
    hasCustomIntegrations: true
    hasDedicatedSupport: true
    hasCustomFeatures: true
    hasSlaGuarantee: false
    isActive: true
    sortOrder: 3
    badge: "VALUE"
    
  enterprise:
    name: "Enterprise"
    price: 799000
    currency: "VND"
    duration: "1 year"
    description: "Enterprise package for 1 year"
    messageLimit: 2147483647
    chatbotLimit: 2147483647
    hasPrioritySupport: true
    hasAnalytics: true
    hasAdvancedAnalytics: true
    hasCustomIntegrations: true
    hasDedicatedSupport: true
    hasCustomFeatures: true
    hasSlaGuarantee: true
    isActive: true
    sortOrder: 4
