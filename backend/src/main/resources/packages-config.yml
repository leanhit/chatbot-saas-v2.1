# Package Configuration for SimplePayment
# This file defines the default packages that will be created when the system initializes

packages:
  free:
    name: "Free"
    price: 0
    currency: "VND"
    duration: "1 month"
    description: "Free trial package with limits"
    messageLimit: 1000
    chatbotLimit: 1
    hasPrioritySupport: false
    hasAnalytics: false
    hasAdvancedAnalytics: false
    hasCustomIntegrations: false
    hasDedicatedSupport: false
    hasCustomFeatures: false
    hasSlaGuarantee: false
    isActive: true
    sortOrder: 1
    badge: null
    
  pro:
    name: "Pro"
    price: 299000
    currency: "VND"
    duration: "3 month"
    description: "Pro package for 3 months"
    messageLimit: 2147483647  # Integer.MAX_VALUE equivalent
    chatbotLimit: 5
    hasPrioritySupport: true
    hasAnalytics: true
    hasAdvancedAnalytics: true
    hasCustomIntegrations: true
    hasDedicatedSupport: true
    hasCustomFeatures: true
    hasSlaGuarantee: false
    isActive: true
