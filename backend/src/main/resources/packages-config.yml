# Package limits configuration
limits:
  free:
    maxMonthlyDeposits: 3
    maxMonthlyAmount: 1000000  # 1M VND
    minDepositAmount: 0
    
  paid:
    minDepositAmount: 1000  # Minimum 1,000 VND for paid packages
    recentPurchaseWarningDays: 30  # Warn if user purchased same package within this period
