# Enhanced PennyBot Default Messages Configuration
pennybot.enhanced-messages.enabled=true

# Enable enhanced message processing
pennybot.default-messages.enhanced=true

# Additional message types
pennybot.default-messages.help-enabled=true
pennybot.default-messages.error-enabled=true
pennybot.default-messages.status-enabled=true
pennybot.default-messages.pricing-enabled=true

# Message formatting options
pennybot.default-messages.use-emojis=true
pennybot.default-messages.use-markdown=true
pennybot.default-messages.use-multiline=true
