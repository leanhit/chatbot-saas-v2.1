# Prometheus Alert Rules for Chatbot SaaS v2.1
groups:
  # Application Health Alerts
  - name: application.rules
    rules:
      - alert: ApplicationDown
        expr: up{job="spring-boot"} == 0
        for: 1m
        labels:
          severity: critical
          service: chatbot-saas
        annotations:
          summary: "Chatbot SaaS application is down"
          description: "Chatbot SaaS application has been down for more than 1 minute on {{ $labels.instance }}"

      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
          service: chatbot-saas
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value | humanizePercentage }} on {{ $labels.instance }}"

      - alert: HighResponseTime
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 1
        for: 5m
        labels:
          severity: warning
          service: chatbot-saas
        annotations:
          summary: "High response time detected"
          description: "95th percentile response time is {{ $value }}s on {{ $labels.instance }}"

      - alert: DatabaseConnectionFailure
        expr: hikaricp_connections_active / hikaricp_connections_max > 0.9
        for: 2m
        labels:
          severity: critical
          service: chatbot-saas
        annotations:
          summary: "Database connection pool exhausted"
          description: "Database connection pool is {{ $value | humanizePercentage }} full on {{ $labels.instance }}"

  # Infrastructure Alerts
  - name: infrastructure.rules
    rules:
      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
          service: infrastructure
        annotations:
          summary: "High CPU usage detected"
          description: "CPU usage is {{ $value }}% on {{ $labels.instance }}"

      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
        for: 5m
        labels:
          severity: warning
          service: infrastructure
        annotations:
          summary: "High memory usage detected"
          description: "Memory usage is {{ $value }}% on {{ $labels.instance }}"

      - alert: DiskSpaceLow
        expr: (1 - (node_filesystem_avail_bytes{fstype!="tmpfs"} / node_filesystem_size_bytes{fstype!="tmpfs"})) * 100 > 90
        for: 5m
        labels:
          severity: critical
          service: infrastructure
        annotations:
          summary: "Disk space running low"
          description: "Disk usage is {{ $value }}% on {{ $labels.instance }} device {{ $labels.device }}"

      - alert: DiskSpaceWarning
        expr: (1 - (node_filesystem_avail_bytes{fstype!="tmpfs"} / node_filesystem_size_bytes{fstype!="tmpfs"})) * 100 > 80
        for: 10m
        labels:
          severity: warning
          service: infrastructure
        annotations:
          summary: "Disk space warning"
          description: "Disk usage is {{ $value }}% on {{ $labels.instance }} device {{ $labels.device }}"

  # Database Alerts
  - name: database.rules
    rules:
      - alert: PostgreSQLDown
        expr: up{job="postgres"} == 0
        for: 1m
        labels:
          severity: critical
          service: database
        annotations:
          summary: "PostgreSQL is down"
          description: "PostgreSQL has been down for more than 1 minute on {{ $labels.instance }}"

      - alert: PostgreSQLTooManyConnections
        expr: pg_stat_activity_count > 150
        for: 5m
        labels:
          severity: warning
          service: database
        annotations:
          summary: "PostgreSQL has too many connections"
          description: "PostgreSQL has {{ $value }} connections on {{ $labels.instance }}"

      - alert: PostgreSQLSlowQueries
        expr: rate(pg_stat_statements_mean_time_seconds[5m]) > 0.5
        for: 5m
        labels:
          severity: warning
          service: database
        annotations:
          summary: "PostgreSQL slow queries detected"
          description: "PostgreSQL average query time is {{ $value }}s on {{ $labels.instance }}"

      - alert: PostgreSQLReplicationLag
        expr: pg_replication_lag_seconds > 60
        for: 5m
        labels:
          severity: warning
          service: database
        annotations:
          summary: "PostgreSQL replication lag"
          description: "PostgreSQL replication lag is {{ $value }}s on {{ $labels.instance }}"

  # Redis Alerts
  - name: redis.rules
    rules:
      - alert: RedisDown
        expr: up{job="redis"} == 0
        for: 1m
        labels:
          severity: critical
          service: redis
        annotations:
          summary: "Redis is down"
          description: "Redis has been down for more than 1 minute on {{ $labels.instance }}"

      - alert: RedisHighMemoryUsage
        expr: redis_memory_used_bytes / redis_memory_max_bytes * 100 > 90
        for: 5m
        labels:
          severity: warning
          service: redis
        annotations:
          summary: "Redis high memory usage"
          description: "Redis memory usage is {{ $value }}% on {{ $labels.instance }}"

      - alert: RedisTooManyConnections
        expr: redis_connected_clients > 80
        for: 5m
        labels:
          severity: warning
          service: redis
        annotations:
          summary: "Redis too many connections"
          description: "Redis has {{ $value }} connected clients on {{ $labels.instance }}"

  # Business Metrics Alerts
  - name: business.rules
    rules:
      - alert: LowUserActivity
        expr: rate(http_requests_total{uri="/api/users"}[5m]) < 0.1
        for: 15m
        labels:
          severity: info
          service: business
        annotations:
          summary: "Low user activity detected"
          description: "User activity rate is {{ $value }} requests/second"

      - alert: HighChatbotUsage
        expr: rate(http_requests_total{uri=~"/api/chat.*"}[5m]) > 10
        for: 5m
        labels:
          severity: info
          service: business
        annotations:
          summary: "High chatbot usage detected"
          description: "Chatbot usage rate is {{ $value }} requests/second"

      - alert: PaymentProcessingFailure
        expr: rate(http_requests_total{uri="/api/payment",status=~"5.."}[5m]) > 0.05
        for: 2m
        labels:
          severity: critical
          service: business
        annotations:
          summary: "Payment processing failures"
          description: "Payment processing failure rate is {{ $value | humanizePercentage }}"

      - alert: NewUserRegistrationSpike
        expr: rate(http_requests_total{uri="/api/auth/register",status="200"}[5m]) > 5
        for: 2m
        labels:
          severity: info
          service: business
        annotations:
          summary: "New user registration spike"
          description: "New user registration rate is {{ $value }} users/second"

  # Security Alerts
  - name: security.rules
    rules:
      - alert: HighFailedLoginRate
        expr: rate(http_requests_total{uri="/api/auth/login",status="401"}[5m]) > 10
        for: 2m
        labels:
          severity: warning
          service: security
        annotations:
          summary: "High failed login rate"
          description: "Failed login rate is {{ $value }} attempts/second"

      - alert: SuspiciousAPIUsage
        expr: rate(http_requests_total[5m]) > 100
        for: 5m
        labels:
          severity: warning
          service: security
        annotations:
          summary: "Suspicious API usage detected"
          description: "API request rate is {{ $value }} requests/second from {{ $labels.instance }}"

      - alert: SSLCertificateExpiring
        expr: probe_ssl_earliest_cert_expiry - time() < 86400 * 7
        for: 1h
        labels:
          severity: warning
          service: security
        annotations:
          summary: "SSL certificate expiring soon"
          description: "SSL certificate for {{ $labels.instance }} expires in {{ $value | humanizeDuration }}"

  # Container Alerts
  - name: container.rules
    rules:
      - alert: ContainerDown
        expr: up{job="cadvisor"} == 0
        for: 1m
        labels:
          severity: critical
          service: container
        annotations:
          summary: "Container is down"
          description: "Container {{ $labels.name }} has been down for more than 1 minute"

      - alert: ContainerHighCPUUsage
        expr: rate(container_cpu_usage_seconds_total{name!=""}[5m]) * 100 > 80
        for: 5m
        labels:
          severity: warning
          service: container
        annotations:
          summary: "Container high CPU usage"
          description: "Container {{ $labels.name }} CPU usage is {{ $value }}%"

      - alert: ContainerHighMemoryUsage
        expr: container_memory_usage_bytes{name!=""} / container_spec_memory_limit_bytes{name!=""} * 100 > 90
        for: 5m
        labels:
          severity: warning
          service: container
        annotations:
          summary: "Container high memory usage"
          description: "Container {{ $labels.name }} memory usage is {{ $value }}%"

      - alert: ContainerRestarting
        expr: increase(container_start_time_seconds{name!=""}[5m]) > 3
        for: 2m
        labels:
          severity: warning
          service: container
        annotations:
          summary: "Container restarting frequently"
          description: "Container {{ $labels.name }} has restarted {{ $value }} times in the last 5 minutes"
