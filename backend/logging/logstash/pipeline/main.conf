# Logstash Pipeline Configuration for Chatbot SaaS v2.1

input {
  # Beats input for Filebeat
  beats {
    port => 5044
  }
  
  # TCP input for application logs
  tcp {
    port => 5000
    codec => json_lines
  }
  
  # UDP input for syslog
  udp {
    port => 5001
    codec => json
  }
}

filter {
  # Parse JSON logs from Spring Boot application
  if [fields][service] == "chatbot-saas" {
    json {
      source => "message"
    }
    
    # Parse timestamp
    if [@timestamp] {
      date {
        match => [ "@timestamp", "ISO8601" ]
        target => "@timestamp"
      }
    }
    
    # Add service name
    mutate {
      add_field => { "service" => "chatbot-saas-backend" }
    }
    
    # Parse log level
    if [level] {
      mutate {
        add_field => { "log_level" => "%{level}" }
      }
    }
    
    # Parse exception stack traces
    if [exception] {
      mutate {
        add_field => { "has_exception" => true }
      }
      
      # Extract exception class
      grok {
        match => { "exception" => "%{WORD:exception_class}:" }
        tag_on_failure => ["_grok_exception_failure"]
      }
    }
    
    # Parse HTTP request information
    if [request_uri] {
      mutate {
        add_field => { "http_request_uri" => "%{request_uri}" }
      }
      
      # Extract endpoint
      grok {
        match => { "request_uri" => "%{URIPATH:api_endpoint}(?:%{URIPARAM:api_params})?" }
        tag_on_failure => ["_grok_uri_failure"]
      }
    }
    
    # Parse user information
    if [user_id] {
      mutate {
        add_field => { "user_id" => "%{user_id}" }
      }
    }
    
    # Parse tenant information
    if [tenant_id] {
      mutate {
        add_field => { "tenant_id" => "%{tenant_id}" }
      }
    }
    
    # Parse performance metrics
    if [execution_time] {
      mutate {
        convert => { "execution_time" => "float" }
        add_field => { "execution_time_ms" => "%{execution_time}" }
      }
    }
    
    # Clean up fields
    mutate {
      remove_field => [ "host", "agent", "ecs", "input", "log" ]
    }
  }
  
  # Parse Nginx access logs
  if [fields][service] == "nginx" {
    grok {
      match => { "message" => "%{NGINXACCESS}" }
      tag_on_failure => ["_grok_nginx_failure"]
    }
    
    # Parse response time
    if [response_time] {
      mutate {
        convert => { "response_time" => "float" }
        add_field => { "nginx_response_time" => "%{response_time}" }
      }
    }
    
    # Parse status code
    if [status] {
      mutate {
        convert => { "status" => "integer" }
        add_field => { "http_status" => "%{status}" }
      }
      
      # Categorize status codes
      if [status] >= 400 {
        mutate {
          add_field => { "is_error" => true }
        }
      }
      
      if [status] >= 500 {
        mutate {
          add_field => { "is_server_error" => true }
        }
      }
    }
    
    # Parse user agent
    if [agent] {
      useragent {
        source => "agent"
        target => "user_agent"
      }
    }
    
    # GeoIP for client IP
    if [clientip] {
      geoip {
        source => "clientip"
        target => "geoip"
      }
    }
    
    # Add service name
    mutate {
      add_field => { "service" => "nginx" }
    }
  }
  
  # Parse database logs
  if [fields][service] == "postgresql" {
    grok {
      match => { "message" => "%{TIMESTAMP_ISO8601:timestamp} \[%{NUMBER:pid}\] %{WORD:log_level}: %{GREEDYDATA:log_message}" }
      tag_on_failure => ["_grok_postgres_failure"]
    }
    
    # Parse timestamp
    if [timestamp] {
      date {
        match => [ "timestamp", "ISO8601" ]
        target => "@timestamp"
      }
    }
    
    # Add service name
    mutate {
      add_field => { "service" => "postgresql" }
    }
    
    # Detect slow queries
    if [log_message] =~ /slow query/ {
      mutate {
        add_field => { "is_slow_query" => true }
      }
    }
    
    # Detect connection issues
    if [log_message] =~ /connection/ {
      mutate {
        add_field => { "is_connection_issue" => true }
      }
    }
  }
  
  # Parse Redis logs
  if [fields][service] == "redis" {
    grok {
      match => { "message" => "%{NUMBER:pid}:%{CHAR:role} %{TIMESTAMP_ISO8601:timestamp} %{WORD:log_level} %{GREEDYDATA:log_message}" }
      tag_on_failure => ["_grok_redis_failure"]
    }
    
    # Parse timestamp
    if [timestamp] {
      date {
        match => [ "timestamp", "ISO8601" ]
        target => "@timestamp"
      }
    }
    
    # Add service name
    mutate {
      add_field => { "service" => "redis" }
    }
    
    # Detect memory issues
    if [log_message] =~ /memory/ {
      mutate {
        add_field => { "is_memory_issue" => true }
      }
    }
  }
  
  # Add common fields
  mutate {
    add_field => { "environment" => "production" }
    add_field => { "application" => "chatbot-saas" }
  }
  
  # Drop debug logs in production
  if [log_level] == "DEBUG" {
    drop { }
  }
  
  # Clean up sensitive information
  if [message] {
    mutate {
      gsub => [
        "message", "password=[^&\s]*", "password=***",
        "message", "token=[^\s&]*", "token=***",
        "message", "secret=[^\s&]*", "secret=***",
        "message", "key=[^\s&]*", "key=***"
      ]
    }
  }
}

output {
  # Output to Elasticsearch
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "chatbot-saas-%{+YYYY.MM.dd}"
    template_name => "chatbot-saas"
    template_pattern => "chatbot-saas-*"
    template => {
      "index_patterns" => ["chatbot-saas-*"]
      "settings" => {
        "number_of_shards" => 1
        "number_of_replicas" => 0
        "index.refresh_interval" => "5s"
      }
      "mappings" => {
        "properties" => {
          "@timestamp" => { "type" => "date" }
          "service" => { "type" => "keyword" }
          "log_level" => { "type" => "keyword" }
          "http_status" => { "type" => "integer" }
          "response_time" => { "type" => "float" }
          "execution_time_ms" => { "type" => "float" }
          "user_id" => { "type" => "keyword" }
          "tenant_id" => { "type" => "keyword" }
          "api_endpoint" => { "type" => "keyword" }
          "is_error" => { "type" => "boolean" }
          "is_server_error" => { "type" => "boolean" }
          "has_exception" => { "type" => "boolean" }
          "is_slow_query" => { "type" => "boolean" }
          "is_memory_issue" => { "type" => "boolean" }
          "geoip" => {
            "properties" => {
              "location" => { "type" => "geo_point" }
              "country_name" => { "type" => "keyword" }
              "city_name" => { "type" => "keyword" }
            }
          }
        }
      }
    }
  }
  
  # Output to stdout for debugging
  stdout {
    codec => rubydebug
  }
}
