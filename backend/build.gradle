plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.3'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.google.protobuf' version '0.9.4'
}

group = 'com.chatbot'
version = '0.0.1-SNAPSHOT'

ext {
    set('testcontainersVersion', "1.19.3")
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // -------------------------------
    // Spring Boot Core
    // -------------------------------
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'    // WebFlux cho reactive, CORS
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'    // Actuator for health checks
    implementation 'org.springframework.kafka:spring-kafka'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'  // WebSocket
    implementation 'org.springframework.boot:spring-boot-starter-data-redis' // Redis support
    implementation 'org.springframework.boot:spring-boot-starter-amqp'  // RabbitMQ

    // -------------------------------
    // gRPC
    // -------------------------------
    implementation 'io.grpc:grpc-netty-shaded:1.58.0'
    implementation 'io.grpc:grpc-protobuf:1.58.0'
    implementation 'io.grpc:grpc-stub:1.58.0'
    implementation 'javax.annotation:javax.annotation-api:1.3.2'

    // -------------------------------
    // Protocol Buffers
    // -------------------------------
    implementation 'com.google.protobuf:protobuf-java:3.24.4'

    // -------------------------------
    // Database
    // -------------------------------
    implementation 'org.postgresql:postgresql:42.7.1'
    implementation 'com.zaxxer:HikariCP:5.1.0'
    
    // H2 Database for Testing
    testImplementation 'com.h2database:h2:2.2.224'

    // -------------------------------
    // JWT
    // -------------------------------
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    implementation 'io.jsonwebtoken:jjwt-impl:0.11.5'
    implementation 'io.jsonwebtoken:jjwt-jackson:0.11.5'

    // -------------------------------
    // Lombok
    // -------------------------------
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // -------------------------------
    // DevTools
    // -------------------------------
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // -------------------------------
    // Testing
    // -------------------------------
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'

    // Testcontainers for integration testing
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.testcontainers:r2dbc'
    testImplementation 'org.testcontainers:testcontainers'

    // -------------------------------
    // MapStruct
    // -------------------------------
    implementation 'org.mapstruct:mapstruct:1.5.3.Final'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.3.Final'

    // -------------------------------
    // Swagger / OpenAPI
    // -------------------------------
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.0'
    implementation 'org.jetbrains.kotlin:kotlin-reflect:1.9.22'

    // -------------------------------
    // HATEOAS
    // -------------------------------
    implementation 'org.springframework.data:spring-data-commons:3.4.3'
    implementation 'org.springframework.hateoas:spring-hateoas:2.1.1'

    // -------------------------------
    // MinIO
    // -------------------------------
    implementation 'io.minio:minio:8.5.1'

    // -------------------------------
    // Apache XML-RPC
    // -------------------------------
    implementation 'org.apache.xmlrpc:xmlrpc-client:3.1.3'
    implementation 'org.apache.xmlrpc:xmlrpc-common:3.1.3'

    // -------------------------------
    // Spring Retry (for payment retry logic)
    // -------------------------------
    implementation 'org.springframework.retry:spring-retry:2.0.5'
    implementation 'org.springframework:spring-aspects:6.1.5'

    // -------------------------------
    // Micrometer (for metrics)
    // -------------------------------
    implementation 'io.micrometer:micrometer-core:1.13.0'
    implementation 'io.micrometer:micrometer-registry-prometheus:1.13.0'

    // -------------------------------
    // Flyway (for database migrations)
    // -------------------------------
    implementation 'org.flywaydb:flyway-core:9.22.3'

    // -------------------------------
    // Caffeine Cache (for in-memory caching with TTL)
    // -------------------------------
    implementation 'com.github.ben-manes.caffeine:caffeine:3.1.8'

    // -------------------------------
    // Email Notification (for agent alerts)
    // -------------------------------
    implementation 'org.springframework.boot:spring-boot-starter-mail'

    // -------------------------------
    // Resilience4j (Circuit Breaker)
    // -------------------------------
    implementation 'io.github.resilience4j:resilience4j-spring-boot3:2.2.0'
    implementation 'io.github.resilience4j:resilience4j-annotations:2.2.0'

    // -------------------------------
    // Distributed Tracing (Micrometer & Zipkin)
    // -------------------------------
    implementation 'io.micrometer:micrometer-tracing-bridge-brave'
    implementation 'io.micrometer:micrometer-tracing'
    implementation 'io.zipkin.reporter2:zipkin-reporter-brave'

    // -------------------------------
    // Structured Logging Logstash Encoder
    // -------------------------------
    implementation 'net.logstash.logback:logstash-logback-encoder:7.4'

    // -------------------------------
    // Penny Bot — AI / LLM
    // -------------------------------
    // OpenAI Java SDK (GPT-4o, Embeddings)
    implementation 'com.openai:openai-java:2.9.0'

    // pgvector — Vector similarity search trong PostgreSQL
    implementation 'com.pgvector:pgvector:0.1.6'

    // Bucket4j — Rate limiting (Redis-backed)
    implementation 'com.bucket4j:bucket4j-core:8.10.1'
    implementation 'com.bucket4j:bucket4j-redis:8.10.1'

    // -------------------------------
    // ShedLock — Distributed locking for scheduled tasks
    // -------------------------------
    implementation 'net.javacrumbs.shedlock:shedlock-spring:4.42.0'
    implementation 'net.javacrumbs.shedlock:shedlock-provider-redis-spring:4.42.0'

    // -------------------------------
    // Testcontainers (for integration testing with real services)
    // -------------------------------
    testImplementation 'org.testcontainers:testcontainers:1.19.8'
    testImplementation 'org.testcontainers:junit-jupiter:1.19.8'
    testImplementation 'org.testcontainers:postgresql:1.19.8'
}

tasks.named('test') {
    enabled = true
    useJUnitPlatform()
    systemProperties([
        'http.nonProxyHosts': 'localhost|127.0.0.1',
        'https.nonProxyHosts': 'localhost|127.0.0.1',
        'file.encoding': 'UTF-8',
        'sun.jnu.encoding': 'UTF-8'
    ])
    
    // Configure test task for multi-database setup
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
    }
    
    // Set test environment variables
    environment "SPRING_PROFILES_ACTIVE", "test"
}

springBoot {
    mainClass = 'com.chatbot.ChatbotApplication'
}

sourceSets {
    main {
        proto {
            srcDir 'src/main/proto'
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += "--enable-preview"
    options.annotationProcessorGeneratedSourcesDirectory = file("build/generated/sources/annotationProcessor/java/main")
}

tasks.withType(JavaExec).configureEach {
    jvmArgs += "--enable-preview"
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}



protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:3.24.4"
    }
    plugins {
        grpc {
            artifact = 'io.grpc:protoc-gen-grpc-java:1.58.0'
        }
    }
    generateProtoTasks {
        all().each { task ->
            task.plugins {
                grpc {}
            }
            task.builtins {
                java {}
            }
        }
        all()*.plugins {
            grpc {}
        }
    }
}
