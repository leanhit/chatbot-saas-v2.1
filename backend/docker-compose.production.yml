# Production Docker Compose for Chatbot SaaS v2.1
version: '3.8'

services:
  # Backend Application
  backend:
    build:
      context: .
      dockerfile: Dockerfile.production
    container_name: chatbot_saas_backend
    restart: always
    env_file:
      - .env.production
    ports:
      - "8080:8080"
    volumes:
      - app_logs:/app/logs
      - app_uploads:/app/uploads
    depends_on:
      - db
      - redis
      - minio
      - rabbitmq
    networks:
      - internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.25'

  # PostgreSQL Database
  db:
    image: ankane/pgvector:latest
    container_name: chatbot_saas_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-traloitudong_db}
      POSTGRES_USER: ${POSTGRES_USER:-traloitudong_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./app-setup/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./app-setup/data/postgres/conf.d:/etc/postgresql/postgresql.conf
    ports:
      - "5432:5432"
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-traloitudong_user} -d ${POSTGRES_DB:-traloitudong_db}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.25'

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: chatbot_saas_redis
    restart: always
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru --appendonly yes
    volumes:
      - redis_data:/data
      - ./app-setup/data/redis/redis.conf:/usr/local/etc/redis/redis.conf
    ports:
      - "6380:6379"
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.1'

  # MinIO Object Storage
  minio:
    image: quay.io/minio/minio:latest
    container_name: chatbot_saas_minio
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_API_CORS_ALLOW_ORIGIN: "${ALLOWED_ORIGINS}"
      MINIO_API_CORS_ALLOW_METHODS: "GET,POST,PUT,DELETE,HEAD,OPTIONS"
      MINIO_API_CORS_ALLOW_HEADERS: "Authorization,Content-Type,X-Tenant-Key,Accept"
      MINIO_API_CORS_EXPOSE_HEADERS: "ETag,Last-Modified,Content-Length,Content-Type"
      MINIO_API_CORS_ALLOW_CREDENTIALS: "true"
    command: server /data --console-address ":9090"
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9090:9090"
    networks:
      - internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.1'

  # RabbitMQ Message Queue
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: chatbot_saas_rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: "/"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./app-setup/data/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - internal
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.1'

  # Botpress Chatbot Platform
  botpress:
    image: botpress/server:v12_28_0
    container_name: chatbot_saas_botpress
    restart: always
    user: root
    environment:
      - DATABASE=postgres
      - DATABASE_URL=postgres://${POSTGRES_USER:-traloitudong_user}:${POSTGRES_PASSWORD}@db:5432/botpress_db
      - BP_PRODUCTION=true
      - BPFS_STORAGE=database
    volumes:
      - botpress_data:/botpress/data
      - ./app-setup/data/botpress:/botpress/data
    ports:
      - "3001:3000"
    depends_on:
      - db
    networks:
      - internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.1'


  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: chatbot_saas_nginx
    restart: always
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./app-setup/data/nginx/conf.d:/etc/nginx/conf.d
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
      - /var/www/html:/var/www/html:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    networks:
      - internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 64M
          cpus: '0.05'

# Volumes
volumes:
  postgres_data:
    driver: local
    name: chatbot_saas_postgres_data
  redis_data:
    driver: local
    name: chatbot_saas_redis_data
  minio_data:
    driver: local
    name: chatbot_saas_minio_data
  rabbitmq_data:
    driver: local
    name: chatbot_saas_rabbitmq_data
  botpress_data:
    driver: local
    name: chatbot_saas_botpress_data

  app_logs:
    driver: local
    name: chatbot_saas_app_logs
  app_uploads:
    driver: local
    name: chatbot_saas_app_uploads

# Networks
networks:
  internal:
    driver: bridge
    name: chatbot_saas_internal
    ipam:
      config:
        - subnet: 172.20.0.0/16
