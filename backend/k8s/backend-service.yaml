# Backend Service for Chatbot SaaS v2.1
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: chatbot-saas
  labels:
    app: chatbot-saas
    component: backend
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/actuator/prometheus"
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
  - name: https
    port: 443
    targetPort: 8080
    protocol: TCP
  selector:
    app: chatbot-saas
    component: backend
---
# Headless service for gRPC
apiVersion: v1
kind: Service
metadata:
  name: backend-grpc
  namespace: chatbot-saas
  labels:
    app: chatbot-saas
    component: backend
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - name: grpc
    port: 50051
    targetPort: 50051
    protocol: TCP
  selector:
    app: chatbot-saas
    component: backend
