# Secrets for Chatbot SaaS v2.1
apiVersion: v1
kind: Secret
metadata:
  name: chatbot-saas-secrets
  namespace: chatbot-saas
  labels:
    app: chatbot-saas
    component: backend
type: Opaque
data:
  # Base64 encoded secrets
  # Use: echo -n 'your-secret' | base64
  jwt-secret: <BASE64_ENCODED_JWT_SECRET>
  postgres-password: <BASE64_ENCODED_POSTGRES_PASSWORD>
  redis-password: <BASE64_ENCODED_REDIS_PASSWORD>
  minio-access-key: <BASE64_ENCODED_MINIO_ACCESS_KEY>
  minio-secret-key: <BASE64_ENCODED_MINIO_SECRET_KEY>
  rabbitmq-password: <BASE64_ENCODED_RABBITMQ_PASSWORD>
  
  # Database connection strings
  identity-db-url: <BASE64_ENCODED_IDENTITY_DB_URL>
  user-db-url: <BASE64_ENCODED_USER_DB_URL>
  tenant-db-url: <BASE64_ENCODED_TENANT_DB_URL>
  app-db-url: <BASE64_ENCODED_APP_DB_URL>
  billing-db-url: <BASE64_ENCODED_BILLING_DB_URL>
  wallet-db-url: <BASE64_ENCODED_WALLET_DB_URL>
  config-db-url: <BASE64_ENCODED_CONFIG_DB_URL>
  message-db-url: <BASE64_ENCODED_MESSAGE_DB_URL>
  
  # External service credentials
  smtp-password: <BASE64_ENCODED_SMTP_PASSWORD>
  slack-webhook-url: <BASE64_ENCODED_SLACK_WEBHOOK_URL>
  
---
# TLS Secret for SSL
apiVersion: v1
kind: Secret
metadata:
  name: chatbot-saas-tls
  namespace: chatbot-saas
  labels:
    app: chatbot-saas
    component: backend
type: kubernetes.io/tls
data:
  tls.crt: <BASE64_ENCODED_TLS_CERTIFICATE>
  tls.key: <BASE64_ENCODED_TLS_PRIVATE_KEY>
