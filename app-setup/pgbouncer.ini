[databases]
# Hub Databases
chatbot_identity_db = host=db-identity port=5432 dbname=chatbot_identity_db
chatbot_user_db = host=db-user port=5432 dbname=chatbot_user_db
chatbot_tenant_db = host=db-tenant port=5432 dbname=chatbot_tenant_db
chatbot_app_db = host=db-app port=5432 dbname=chatbot_app_db
chatbot_config_db = host=db-config port=5432 dbname=chatbot_config_db
chatbot_message_db = host=db-message port=5432 dbname=chatbot_message_db

[pgbouncer]
# Listen address
listen_addr = 0.0.0.0
listen_port = 6432

# Authentication
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

# Pooling mode
pool_mode = transaction

# Connection limits
max_client_conn = 1000
default_pool_size = 25
min_pool_size = 5
reserve_pool_size = 10
reserve_pool_timeout = 3

# Timeouts
server_lifetime = 3600
server_idle_timeout = 600
server_connect_timeout = 15
query_timeout = 300

# Logging
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
log_stats = 1
stats_period = 60

# Admin
admin_users = postgres
