services:
  # ----------------------------------------
  # PostgreSQL Identity Hub (pgvector)
  # ----------------------------------------
  db-identity:
    image: ankane/pgvector:latest
    container_name: chatbot_saas_postgres_identity
    restart: always
    environment:
      POSTGRES_DB: chatbot_identity_db
      POSTGRES_USER: chatbot_user
      POSTGRES_PASSWORD: chatbot_Admin_2025
    volumes:
      - postgres_identity_data:/var/lib/postgresql/data
      - ./postgres-init-identity.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
    - "5433:5432"
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatbot_user -d chatbot_identity_db"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ----------------------------------------
  # PostgreSQL User Hub (pgvector)
  # ----------------------------------------
  db-user:
    image: ankane/pgvector:latest
    container_name: chatbot_saas_postgres_user
    restart: always
    environment:
      POSTGRES_DB: chatbot_user_db
      POSTGRES_USER: chatbot_user
      POSTGRES_PASSWORD: chatbot_Admin_2025
    volumes:
      - postgres_user_data:/var/lib/postgresql/data
      - ./postgres-init-user.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
    - "5434:5432"
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatbot_user -d chatbot_user_db"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ----------------------------------------
  # PostgreSQL Tenant Hub (pgvector)
  # ----------------------------------------
  db-tenant:
    image: ankane/pgvector:latest
    container_name: chatbot_saas_postgres_tenant
    restart: always
    environment:
      POSTGRES_DB: chatbot_tenant_db
      POSTGRES_USER: chatbot_user
      POSTGRES_PASSWORD: chatbot_Admin_2025
    volumes:
      - postgres_tenant_data:/var/lib/postgresql/data
      - ./postgres-init-tenant.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
    - "5435:5432"
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatbot_user -d chatbot_tenant_db"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ----------------------------------------
  # PostgreSQL App Hub (pgvector)
  # ----------------------------------------
  db-app:
    image: ankane/pgvector:latest
    container_name: chatbot_saas_postgres_app
    restart: always
    environment:
      POSTGRES_DB: chatbot_app_db
      POSTGRES_USER: chatbot_user
      POSTGRES_PASSWORD: chatbot_Admin_2025
    volumes:
      - postgres_app_data:/var/lib/postgresql/data
      - ./postgres-init-app.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
    - "5436:5432"
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatbot_user -d chatbot_app_db"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ----------------------------------------
  # PostgreSQL Config Hub (pgvector)
  # ----------------------------------------
  db-config:
    image: ankane/pgvector:latest
    container_name: chatbot_saas_postgres_config
    restart: always
    environment:
      POSTGRES_DB: chatbot_config_db
      POSTGRES_USER: chatbot_user
      POSTGRES_PASSWORD: chatbot_Admin_2025
    volumes:
      - postgres_config_data:/var/lib/postgresql/data
      - ./postgres-init-config.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
    - "5439:5432"
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatbot_user -d chatbot_config_db"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ----------------------------------------
  # PostgreSQL Message Hub (pgvector)
  # ----------------------------------------
  db-message:
    image: ankane/pgvector:latest
    container_name: chatbot_saas_postgres_message
    restart: always
    environment:
      POSTGRES_DB: chatbot_message_db
      POSTGRES_USER: chatbot_user
      POSTGRES_PASSWORD: chatbot_Admin_2025
    volumes:
      - postgres_message_data:/var/lib/postgresql/data
      - ./postgres-init-message.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
    - "5440:5432"
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatbot_user -d chatbot_message_db"]
      interval: 10s
      timeout: 5s
      retries: 10

  
  # ----------------------------------------
  # MinIO
  # ----------------------------------------
  minio:
    image: quay.io/minio/minio
    container_name: chatbot_saas_minio
    restart: always
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_API_CORS_ALLOW_ORIGIN: "http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3003,http://localhost:8080,http://127.0.0.1:3000,http://127.0.0.1:3001,http://127.0.0.1:3002,http://127.0.0.1:3003,http://127.0.0.1:8080"
      MINIO_API_CORS_ALLOW_METHODS: "GET,POST,PUT,DELETE,HEAD,OPTIONS"
      MINIO_API_CORS_ALLOW_HEADERS: "Authorization,Content-Type,X-Tenant-Key,Accept,Accept-Language,Connection,Referer,Sec-Fetch-Dest,Sec-Fetch-Mode,Sec-Fetch-Site,User-Agent,sec-ch-ua,sec-ch-ua-mobile,sec-ch-ua-platform"
      MINIO_API_CORS_EXPOSE_HEADERS: "ETag,Last-Modified,Content-Length,Content-Type"
      MINIO_API_CORS_ALLOW_CREDENTIALS: "true"
    command: server /data --console-address ":9090"
    ports:
      - "9000:9000"
      - "9090:9090"
    volumes:
      - minio_data:/data
    networks:
      - internal


  # ----------------------------------------
  # RabbitMQ
  # ----------------------------------------
  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: chatbot_saas_rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
      RABBITMQ_DEFAULT_VHOST: /
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - internal
  # ----------------------------------------
  # Kafka + Zookeeper
  # ----------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: chatbot_saas_zookeeper
    restart: always
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - internal

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: chatbot_saas_kafka
    restart: always
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    ports:
      - "9092:9092"
    networks:
      - internal


  # ----------------------------------------
  # Redis
  # ----------------------------------------
  redis:
    image: redis:7-alpine
    container_name: chatbot_saas_redis
    restart: always
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - internal

volumes:
  postgres_identity_data:
    driver: local
    name: chatbot_saas_postgres_identity_data
  postgres_user_data:
    driver: local
    name: chatbot_saas_postgres_user_data
  postgres_tenant_data:
    driver: local
    name: chatbot_saas_postgres_tenant_data
  postgres_app_data:
    driver: local
    name: chatbot_saas_postgres_app_data
  postgres_config_data:
    driver: local
    name: chatbot_saas_postgres_config_data
  postgres_message_data:
    driver: local
    name: chatbot_saas_postgres_message_data

  minio_data:
    driver: local
    name: chatbot_saas_minio_data
  rabbitmq_data:
    driver: local
    name: chatbot_saas_rabbitmq_data
  redis_data:
    driver: local
    name: chatbot_saas_redis_data

networks:
  internal:
    driver: bridge
    name: chatbot_saas_internal
