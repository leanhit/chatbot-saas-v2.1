services:
  chatbot-app:
    build:
      context: ..
      dockerfile: app-deploy/Dockerfile
    image: ${DOCKER_IMAGE:-chatbot-saas-app:latest}
    container_name: chatbot_saas_app
    restart: always
    ports:
      - "8080:80"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - HIBERNATE_DDL_AUTO=none
      - KAFKA_BOOTSTRAP_SERVERS=chatbot_saas_kafka:9092
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=chatbot_saas_kafka:9092
      - KAFKA_ENABLED=true
      - DB_USER=${DB_USER:-chatbot_user}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-http://minio:9000}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY must be set}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:?MINIO_SECRET_KEY must be set}
      - MINIO_BUCKET=${MINIO_BUCKET:-chatbot-files}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:?ALLOWED_ORIGINS must be set}
    volumes:
      - ./config/application-docker.yml:/app/config/application-docker.yml
      - ./logs:/app/logs
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - internal

networks:
  internal:
    external: true
    name: chatbot_saas_internal
