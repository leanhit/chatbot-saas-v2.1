spring:
  config:
    activate:
      on-profile: docker
  threads:
    virtual:
      enabled: true
  kafka:
    enabled: ${KAFKA_ENABLED:true}
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:chatbot_saas_kafka:9092}
    admin:
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:chatbot_saas_kafka:9092}
    consumer:
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:chatbot_saas_kafka:9092}
    producer:
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:chatbot_saas_kafka:9092}
    properties:
      bootstrap.servers: ${KAFKA_BOOTSTRAP_SERVERS:chatbot_saas_kafka:9092}
  # Override Kafka auto-configuration exclusion from base application.properties
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
  flyway:
    validate-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:chatbot_saas_redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  rabbitmq:
    host: ${RABBITMQ_HOST:chatbot_saas_rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:admin}
    password: ${RABBITMQ_PASSWORD:admin123}

# Top-level kafka.enabled property for @ConditionalOnProperty annotation
kafka:
  enabled: ${KAFKA_ENABLED:true}

# PgBouncer & 6 Hub Database Configurations
pgbouncer:
  enabled: true
  host: ${PGBOUNCER_HOST:chatbot_saas_pgbouncer}
  port: ${PGBOUNCER_PORT:6432}

app:
  datasource:
    identity:
      jdbc-url: jdbc:postgresql://${IDENTITY_DB_HOST:chatbot_saas_postgres_identity}:${IDENTITY_DB_PORT:5432}/chatbot_identity_db
      username: ${DB_USER:chatbot_user}
      password: ${DB_PASSWORD:chatbot_Admin_2025}
      driver-class-name: org.postgresql.Driver
      hikari:
        maximum-pool-size: 5
        minimum-idle: 1
    user:
      jdbc-url: jdbc:postgresql://${USER_DB_HOST:chatbot_saas_postgres_user}:${USER_DB_PORT:5432}/chatbot_user_db
      username: ${DB_USER:chatbot_user}
      password: ${DB_PASSWORD:chatbot_Admin_2025}
      driver-class-name: org.postgresql.Driver
      hikari:
        maximum-pool-size: 20
        minimum-idle: 5
    tenant:
      jdbc-url: jdbc:postgresql://${TENANT_DB_HOST:chatbot_saas_postgres_tenant}:${TENANT_DB_PORT:5432}/chatbot_tenant_db
      username: ${DB_USER:chatbot_user}
      password: ${DB_PASSWORD:chatbot_Admin_2025}
      driver-class-name: org.postgresql.Driver
      hikari:
        maximum-pool-size: 10
        minimum-idle: 2
    app:
      jdbc-url: jdbc:postgresql://${APP_DB_HOST:chatbot_saas_postgres_app}:${APP_DB_PORT:5432}/chatbot_app_db
      username: ${DB_USER:chatbot_user}
      password: ${DB_PASSWORD:chatbot_Admin_2025}
      driver-class-name: org.postgresql.Driver
      hikari:
        maximum-pool-size: 5
        minimum-idle: 1
    config:
      jdbc-url: jdbc:postgresql://${CONFIG_DB_HOST:chatbot_saas_postgres_config}:${CONFIG_DB_PORT:5432}/chatbot_config_db
      username: ${DB_USER:chatbot_user}
      password: ${DB_PASSWORD:chatbot_Admin_2025}
      driver-class-name: org.postgresql.Driver
      hikari:
        maximum-pool-size: 3
        minimum-idle: 1
    message:
      jdbc-url: jdbc:postgresql://${MESSAGE_DB_HOST:chatbot_saas_postgres_message}:${MESSAGE_DB_PORT:5432}/chatbot_message_db
      username: ${DB_USER:chatbot_user}
      password: ${DB_PASSWORD:chatbot_Admin_2025}
      driver-class-name: org.postgresql.Driver
      hikari:
        maximum-pool-size: 15
        minimum-idle: 5

  # Integrations
  integrations:
    botpress:
      enabled: false
    minio:
      enabled: true
      endpoint: ${MINIO_ENDPOINT:http://chatbot_saas_minio:9000}
      access-key: ${MINIO_ACCESS_KEY:minioadmin}
      secret-key: ${MINIO_SECRET_KEY:minioadmin}
      bucket: ${MINIO_BUCKET:chatbot-files}

minio:
  endpoint: ${MINIO_ENDPOINT:http://chatbot_saas_minio:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  accessKey: ${MINIO_ACCESS_KEY:minioadmin}
  secretKey: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:chatbot-files}
  bucket-name: ${MINIO_BUCKET:chatbot-files}


  # Security & JWT Token
  jwt:
    secret: ${JWT_SECRET:ChangeMeSuperSecretKeyForChatbotSaaS2026!}
    expiration: 86400000

  # CORS Allowed Domains
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost,http://localhost:8080,https://truyenthongviet.vn,https://www.truyenthongviet.vn,https://chat.truyenthongviet.vn,http://103.149.99.7,http://103.149.99.7:8080,https://103.149.99.7}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  health:
    mail:
      enabled: false
    kafka:
      enabled: false
    botpress:
      enabled: false

server:
  port: 8080

logging:
  level:
    root: WARN
    com.chatbot: INFO
  file:
    name: /app/logs/application.log

resilience4j:
  ratelimiter:
    instances:
      authRateLimit:
        limitForPeriod: 100
        limitRefreshPeriod: 1s
        timeoutDuration: 2000ms

llm:
  enabled: ${LLM_ENABLED:false}
  provider: ${LLM_PROVIDER:openai}
  api:
    key: ${LLM_API_KEY:${OPENAI_API_KEY:}}
    url: ${LLM_API_URL:https://api.openai.com/v1/chat/completions}
  model: ${LLM_MODEL:gpt-3.5-turbo}

