spring:
  config:
    activate:
      on-profile: docker

# PgBouncer & 6 Hub Database Configurations
pgbouncer:
  enabled: true
  host: ${PGBOUNCER_HOST:pgbouncer}
  port: ${PGBOUNCER_PORT:6432}

app:
  datasource:
    identity:
      jdbc-url: jdbc:postgresql://${pgbouncer.host}:${pgbouncer.port}/chatbot_identity_db
      username: ${DB_USER:chatbot_user}
      password: ${DB_PASSWORD:chatbot_Admin_2025}
      driver-class-name: org.postgresql.Driver
      hikari:
        maximum-pool-size: 5
        minimum-idle: 1
    user:
      jdbc-url: jdbc:postgresql://${pgbouncer.host}:${pgbouncer.port}/chatbot_user_db
      username: ${DB_USER:chatbot_user}
      password: ${DB_PASSWORD:chatbot_Admin_2025}
      driver-class-name: org.postgresql.Driver
      hikari:
        maximum-pool-size: 20
        minimum-idle: 5
    tenant:
      jdbc-url: jdbc:postgresql://${pgbouncer.host}:${pgbouncer.port}/chatbot_tenant_db
      username: ${DB_USER:chatbot_user}
      password: ${DB_PASSWORD:chatbot_Admin_2025}
      driver-class-name: org.postgresql.Driver
      hikari:
        maximum-pool-size: 10
        minimum-idle: 2
    app:
      jdbc-url: jdbc:postgresql://${pgbouncer.host}:${pgbouncer.port}/chatbot_app_db
      username: ${DB_USER:chatbot_user}
      password: ${DB_PASSWORD:chatbot_Admin_2025}
      driver-class-name: org.postgresql.Driver
      hikari:
        maximum-pool-size: 5
        minimum-idle: 1
    config:
      jdbc-url: jdbc:postgresql://${pgbouncer.host}:${pgbouncer.port}/chatbot_config_db
      username: ${DB_USER:chatbot_user}
      password: ${DB_PASSWORD:chatbot_Admin_2025}
      driver-class-name: org.postgresql.Driver
      hikari:
        maximum-pool-size: 3
        minimum-idle: 1
    message:
      jdbc-url: jdbc:postgresql://${pgbouncer.host}:${pgbouncer.port}/chatbot_message_db
      username: ${DB_USER:chatbot_user}
      password: ${DB_PASSWORD:chatbot_Admin_2025}
      driver-class-name: org.postgresql.Driver
      hikari:
        maximum-pool-size: 15
        minimum-idle: 5

  # Redis Configuration
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  # MinIO Object Storage
  minio:
    endpoint: ${MINIO_ENDPOINT:http://minio:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:chatbot-saas}

  # RabbitMQ Message Broker
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:admin}
    password: ${RABBITMQ_PASSWORD:admin123}

  # Security & JWT Token
  jwt:
    secret: ${JWT_SECRET:ChangeMeSuperSecretKeyForChatbotSaaS2026!}
    expiration: 86400000

  # CORS Allowed Domains
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost,https://yourdomain.com}

server:
  port: 8080

logging:
  level:
    root: WARN
    com.chatbot: INFO
  file:
    name: /app/logs/application.log
